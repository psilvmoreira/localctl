site_name: localctl
site_description: Local Kubernetes for app developers. One CLI, one cluster, a real HTTPS subdomain per app.
site_author: Pedro Moreira
site_url: https://psilvmoreira.github.io/localctl/
repo_name: psilvmoreira/localctl
repo_url: https://github.com/psilvmoreira/localctl
edit_uri: edit/master/docs/

docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  icon:
    logo: material/kubernetes
    repo: fontawesome/brands/github
    edit: material/pencil
  favicon: assets/favicon.svg
  # Three-way toggle: follow the OS, then force light, then force dark.
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Get started: getting-started.md
  - Guides:
      - Debugging: debugging.md
      - Adding tools: adding-tools.md
      - Troubleshooting: troubleshooting.md
      - Uninstalling: uninstalling.md
  - Reference:
      - CLI commands: cli-reference.md
      - Config schema: config-schema.md
      - Architecture: architecture.md
  - Project:
      - Contributing: contributing.md
      - Releasing: releasing.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
      title: On this page
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/psilvmoreira/localctl
      name: localctl on GitHub
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/package/@localctl/cli
      name: "@localctl/cli on npm"

copyright: Copyright &copy; 2026 Pedro Moreira &middot; <a href="https://github.com/psilvmoreira/localctl/blob/master/LICENSE">MIT License</a>
