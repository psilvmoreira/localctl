# Commit prefixes decide what a merged Dependabot PR releases (PR titles become the squash
# commit): runtime deps of the CLI ship to users, so they release a patch; the rest don't.
version: 2
updates:
  - package-ecosystem: npm
    directory: /cli
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      cli-dependencies:
        update-types: [minor, patch]
    # chalk 5+ is ESM-only (the CLI is CommonJS) and commander 14+ needs Node 20+ (the CLI
    # supports Node 18). Both are breaking for users: upgrade by hand in a feat!: change.
    ignore:
      - dependency-name: chalk
        versions: [">=5"]
      - dependency-name: commander
        versions: [">=14"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      release-tooling:
        update-types: [minor, patch]
    # Pinned to v9 in #3: v10 broke release notes generation. Re-test by hand before moving.
    ignore:
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
