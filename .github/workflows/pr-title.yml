name: pr-title

# PRs are squash-merged, so the PR title becomes the commit on master - and semantic-release
# reads that commit to decide the next version. feat: -> minor, fix: -> patch, feat!: -> major.
# Separate from ci.yml so editing the title re-runs only this check, not the whole test matrix.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Preview of what merging this PR releases, shown as a notice on the check and in the job
      # summary. Mirrors the conventionalcommits preset's default rules used by .releaserc.json.
      # semantic-release reads every commit on the base branch since the last tag, not only the
      # new one, so commits that merged without triggering a release count too.
      - name: Preview release
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # 3 = major, 2 = minor, 1 = patch, 0 = no release
          rank() {
            case "$(printf '%s' "$1" | sed -nE 's/^([a-z]+)(\([^)]*\))?(!?):.*/\3\1/p')" in
              !*)              echo 3 ;;
              feat)            echo 2 ;;
              fix|perf|revert) echo 1 ;;
              *)               echo 0 ;;
            esac
          }

          last=$(git tag --merged "origin/$BASE_REF" --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          range="origin/$BASE_REF"
          [ -n "$last" ] && range="$last..origin/$BASE_REF"
          last=${last:-v0.0.0}

          best=$(rank "$TITLE")
          pending=""
          while IFS= read -r subject; do
            r=$(rank "$subject")
            [ "$r" -gt 0 ] && pending="$pending- \`$subject\`"$'\n'
            [ "$r" -gt "$best" ] && best=$r
          done < <(git log --format=%s "$range")
          if git log --format=%B "$range" | grep -qE '^BREAKING[ -]CHANGE:'; then best=3; fi

          IFS=. read -r major minor patch <<< "${last#v}"
          case $best in
            3) bump=major; next="$((major + 1)).0.0" ;;
            2) bump=minor; next="$major.$((minor + 1)).0" ;;
            1) bump=patch; next="$major.$minor.$((patch + 1))" ;;
            *) bump=none ;;
          esac

          if [ "$bump" = none ]; then
            msg="Merging this PR releases nothing (current: $last)."
          elif [ "$BASE_REF" = master ]; then
            msg="Merging this PR releases v$next ($bump bump from $last)."
          else
            msg="Merging this PR releases a $bump pre-release on $BASE_REF."
          fi
          [ -n "$pending" ] && msg="$msg Includes unreleased commits already on $BASE_REF."

          echo "::notice title=Release preview::$msg"
          {
            echo "### Release preview"
            echo "$msg"
            if [ -n "$pending" ]; then
              echo
              echo "Unreleased commits already on $BASE_REF:"
              printf '%s' "$pending"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
