name: docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure git identity for gh-deploy's commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: mkdocs-material-${{ hashFiles('mkdocs.yml') }}

      - name: Install MkDocs Material
        # Pinned below MkDocs 2.0: it drops the plugin/theme system Material for MkDocs relies on.
        run: pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.7,<10"

      - name: Build (strict - fails on broken links/config)
        run: mkdocs build --strict

      - name: Deploy to gh-pages
        run: mkdocs gh-deploy --force --clean
