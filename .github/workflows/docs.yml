name: docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "overrides/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure git identity for gh-deploy's commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: mkdocs-material-${{ hashFiles('mkdocs.yml') }}

      - name: Install MkDocs Material
        # Pinned below MkDocs 2.0: it drops the plugin/theme system Material for MkDocs relies on.
        run: pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.7,<10"

      - name: Build (strict - fails on broken links/config)
        run: mkdocs build --strict

      - name: Deploy to gh-pages
        run: mkdocs gh-deploy --force --clean
