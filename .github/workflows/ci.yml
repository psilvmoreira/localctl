name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    # PRs are squash-merged, so the PR title becomes the commit on master - and semantic-release
    # reads that commit to decide the next version. feat: -> minor, fix: -> patch, feat!: -> major.
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The CLI targets macOS and Windows users; Linux is the cheap baseline. Node 18 is the
        # declared engines floor, 22 is current LTS.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - run: npm ci

      - name: Smoke test (every command loads, --version matches package.json)
        run: npm test

      - name: Packed tarball test (install the real artifact, run it)
        run: npm run test:pack
