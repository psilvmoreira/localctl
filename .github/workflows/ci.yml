name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The CLI targets macOS and Windows users; Linux is the cheap baseline. Node 18 is the
        # declared engines floor, 22 is current LTS.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - run: npm ci

      - name: Smoke test (every command loads, --version matches package.json)
        run: npm test

      - name: Packed tarball test (install the real artifact, run it)
        run: npm run test:pack

  # A PR with no changes squash-merges into an empty commit. If its title is feat:/fix:, that
  # either releases identical code under a new version or silently releases nothing (the release
  # workflow's path filters skip commits that touch no files). Fail early instead.
  not-empty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: PR changes at least one file
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --quiet "origin/$BASE_REF...HEAD"; then
            echo "::error::This PR has no changes against $BASE_REF - it was probably merged already."
            exit 1
          fi

  # docs.yml only builds after merge, so a broken link would land on master first.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Install MkDocs Material
        run: pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.7,<10"

      - name: Build (strict - fails on broken links/config)
        run: mkdocs build --strict
